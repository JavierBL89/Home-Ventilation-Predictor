  <<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Model Metrics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f9fc;
        padding: 2rem;
      }
      h1 {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        border-radius: 8px;
        overflow: hidden;
      }
      thead {
        background: #4a90e2;
        color: white;
      }
      th, td {
        text-align: center;
        padding: 12px;
        border-bottom: 1px solid #ddd;
      }
      tr:hover {
        background: #f1f5fa;
      }
      .status-success {
        color: green;
        font-weight: bold;
      }
      .status-error {
        color: red;
        font-weight: bold;
      }
      #best-model {
        margin-top: 2rem;
        text-align: center;
        font-size: 1.2rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Model Metrics</h1>
    <table id="metrics-table">
      <thead>
        <tr>
          <th>Model</th>
          <th>MAE</th>
          <th>MSE</th>
          <th>RMSE</th>
          <th>R²</th>
          <th>Adj. R²</th>
          <th>MAPE (%)</th>
          <th>AIC</th>
          <th>BIC</th>
          <th>Sample Size</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be inserted dynamically -->
      </tbody>
    </table>
  
    <div id="best-model"></div>
  
    <script>
      async function loadMetrics() {
        try {
          const res = await fetch('/api/model_metrics');
          const data = await res.json();
  
          const tbody = document.querySelector("#metrics-table tbody");
          tbody.innerHTML = ""; // clear before loading
  
          ["arima", "prophet", "timesnet"].forEach(model => {
            const m = data[model];
            if (!m) return;
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${m.model_name}</td>
              <td>${m.mae ?? "-"}</td>
              <td>${m.mse ?? "-"}</td>
              <td>${m.rmse ?? "-"}</td>
              <td>${m.r2 ?? "-"}</td>
              <td>${m.adj_r2 ?? "-"}</td>
              <td>${m.mape ?? "-"}</td>
              <td>${m.aic ?? "-"}</td>
              <td>${m.bic ?? "-"}</td>
              <td>${m.sample_size ?? "-"}</td>
              <td class="${m.status === 'success' ? 'status-success' : 'status-error'}">
                ${m.status}
              </td>
            `;
            tbody.appendChild(row);
          });
  
          if (data.best_model) {
            document.getElementById("best-model").textContent =
              `Best Model: ${data.best_model.name} (R² = ${data.best_model.r2_score})`;
          }
        } catch (err) {
          console.error("Failed to load metrics:", err);
        }
      }
  
      loadMetrics();
    </script>
  </body>
  </html>
